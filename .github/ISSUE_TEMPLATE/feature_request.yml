name: "\U0001F680 新 Feature 建议"
description: 我希望增加 xxx 功能；现有的 xxx 功能不好用...
body:
  - type: markdown
    attributes:
      value: |
        感谢您使用 Junln Framework！请您花些时间填写这份 Feature 调查。
  - type: checkboxes
    id: checkboxes
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Feature 描述
      description: 清楚而简洁地描述您的 Feature。另外，非常欢迎您对此 Feature 提交 PR。
      placeholder: 例如：我希望增加 xxx 功能；现有的 xxx 功能不好用...
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: 描述一下您想要的解决方案
      description: 清楚而简洁地描述您想要的解决方案。
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 描述一下您考虑过的替代方案
      description: 清楚而简洁地描述您考虑过的任何替代解决方案或功能。
  - type: textarea
    id: additional-context
    attributes:
      label: 额外补充
      description: 添加您在其他框架或场景遇见的效果截图或链接，以及一切能帮助理解 Feature 的信息。
